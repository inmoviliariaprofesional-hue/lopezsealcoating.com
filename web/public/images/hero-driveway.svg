<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
  <title id="title">Freshly sealed asphalt driveway leading home</title>
  <desc id="desc">An original illustration of a dark asphalt driveway in strong perspective, framed by trees and leading toward a modest house.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8396a3"/>
      <stop offset="0.56" stop-color="#d6c6a4"/>
      <stop offset="1" stop-color="#e4b865"/>
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#546346"/>
      <stop offset="1" stop-color="#202b24"/>
    </linearGradient>
    <linearGradient id="asphalt" x1="0.64" y1="0.12" x2="0.34" y2="1">
      <stop offset="0" stop-color="#4c5050"/>
      <stop offset="0.38" stop-color="#2f3334"/>
      <stop offset="1" stop-color="#15191a"/>
    </linearGradient>
    <linearGradient id="sealSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.10"/>
      <stop offset="0.78" stop-color="#fff" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="houseWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e1d2"/>
      <stop offset="1" stop-color="#b9b4a9"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="76%" cy="29%" r="36%">
      <stop offset="0" stop-color="#fff4c5" stop-opacity="0.54"/>
      <stop offset="1" stop-color="#fff4c5" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="roadGrain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="24" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faintNoise">
        <feFuncA type="table" tableValues="0 0.13"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faintNoise" mode="soft-light"/>
    </filter>
    <clipPath id="roadClip">
      <path d="M133 760C253 635 382 517 526 422C576 389 620 361 663 338L719 350C671 398 654 445 690 482C773 566 928 660 1080 760Z"/>
    </clipPath>
  </defs>

  <!-- Warm, restrained landscape -->
  <rect width="1100" height="760" fill="url(#sky)"/>
  <rect width="1100" height="760" fill="url(#sunGlow)"/>
  <circle cx="821" cy="212" r="51" fill="#fff3bf" opacity="0.28" filter="url(#soft)"/>
  <path d="M0 333C111 315 210 326 300 307C391 288 449 304 526 300C643 294 725 274 823 290C909 304 990 286 1100 277V477H0Z" fill="#354238" opacity="0.73"/>
  <path d="M0 389C150 363 267 378 408 353C542 328 651 349 785 333C910 318 1012 323 1100 310V760H0Z" fill="url(#lawn)"/>

  <!-- Distant house remains secondary to the driveway -->
  <g transform="translate(698 248)">
    <rect x="23" y="73" width="221" height="117" rx="3" fill="#171b1b" opacity="0.24" transform="translate(8 9)"/>
    <path d="M0 86L132 5L274 87Z" fill="#3b3c39"/>
    <path d="M17 86L132 17L254 86Z" fill="#615d55"/>
    <rect x="31" y="84" width="208" height="110" fill="url(#houseWall)"/>
    <rect x="52" y="115" width="60" height="48" rx="2" fill="#334450"/>
    <rect x="60" y="122" width="21" height="34" fill="#cfae69" opacity="0.55"/>
    <rect x="84" y="122" width="21" height="34" fill="#cfae69" opacity="0.43"/>
    <rect x="155" y="107" width="54" height="87" fill="#343a3a"/>
    <circle cx="197" cy="151" r="3" fill="#d1b25d"/>
    <path d="M31 194H240" stroke="#77776f" stroke-width="7"/>
    <rect x="218" y="42" width="13" height="43" fill="#4d4a45"/>
  </g>

  <!-- Trees frame the view without obscuring the destination -->
  <g fill="#1d2923">
    <path d="M30 454L51 213L75 337L107 123L136 317L175 193L196 443Z"/>
    <path d="M865 410L893 202L919 312L952 111L980 302L1023 170L1051 392Z"/>
  </g>
  <g fill="#2d3a30" opacity="0.95">
    <circle cx="45" cy="239" r="85"/><circle cx="120" cy="208" r="101"/><circle cx="188" cy="281" r="76"/>
    <circle cx="931" cy="225" r="97"/><circle cx="1025" cy="218" r="113"/><circle cx="1090" cy="302" r="91"/>
  </g>
  <g fill="#5a6b53" opacity="0.44">
    <circle cx="85" cy="178" r="53"/><circle cx="174" cy="252" r="42"/>
    <circle cx="966" cy="165" r="51"/><circle cx="1060" cy="252" r="58"/>
  </g>

  <!-- Fresh blacktop is the dominant foreground subject -->
  <path d="M133 760C253 635 382 517 526 422C576 389 620 361 663 338L719 350C671 398 654 445 690 482C773 566 928 660 1080 760Z" fill="url(#asphalt)" filter="url(#roadGrain)"/>
  <path d="M133 760C253 635 382 517 526 422C576 389 620 361 663 338" fill="none" stroke="#8e948b" stroke-width="16" stroke-opacity="0.48"/>
  <path d="M719 350C671 398 654 445 690 482C773 566 928 660 1080 760" fill="none" stroke="#777f72" stroke-width="14" stroke-opacity="0.45"/>
  <path d="M390 760C447 621 524 510 629 414C652 393 671 374 696 356C678 391 673 422 688 450C724 519 829 621 924 760Z" fill="url(#sealSheen)" clip-path="url(#roadClip)"/>
  <path d="M550 709C584 611 638 549 710 516" fill="none" stroke="#93999a" stroke-width="3" stroke-linecap="round" opacity="0.13"/>
  <path d="M753 673C718 600 691 564 649 530" fill="none" stroke="#0a0c0d" stroke-width="4" stroke-linecap="round" opacity="0.34"/>

  <!-- Foreground foliage and vignette -->
  <path d="M0 519C50 497 100 496 174 528L277 760H0Z" fill="#17221c" opacity="0.89"/>
  <path d="M1100 496C1026 487 989 516 955 555L1068 760H1100Z" fill="#18231d" opacity="0.86"/>
  <rect width="1100" height="760" fill="none" stroke="#0a0d0e" stroke-width="38" opacity="0.18"/>
</svg>
